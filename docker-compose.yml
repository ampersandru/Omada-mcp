services:
  omada-mcp:
    container_name: omada-mcp
    image: omada-mcp:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # ========================================================================
      # Omada Gateway / Controller Connection (Fusion 2.5G Gateway)
      # ========================================================================
      - OMADA_BASE_URL=https://192.168.1.1
      - OMADA_USERNAME=admin
      - OMADA_PASSWORD=your_password_here
      - OMADA_STRICT_SSL=false
      - OMADA_AUTH_MODE=web
      # - OMADA_SITE_ID=Default

      # Capability Profile: safe-read (read-only), ops-write, admin, or compatibility
      - OMADA_CAPABILITY_PROFILE=safe-read

      # ========================================================================
      # MCP HTTP Server Configuration (Required for Docker / Portainer persistent service)
      # ========================================================================
      - MCP_SERVER_USE_HTTP=true
      - MCP_UNSAFE_ENABLE_HTTP=true
      - MCP_HTTP_BIND_ADDR=0.0.0.0
      - MCP_HTTP_PORT=3000
      - MCP_HTTP_PATH=/mcp
      - MCP_SERVER_LOG_LEVEL=info
      - MCP_SERVER_LOG_FORMAT=plain
